kind = "web"
previewPath = "/"
title = "Marine Debris Sonar"
description = "A focused marine intelligence prototype for uploading side-scan sonar imagery, reviewing clearly labelled demonstration detections, verifying anomalies, viewing demo geolocations, and exporting an investigation report."
version = "1.0.0"
id = "artifacts/marine-debris-sonar"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21846

[services.development]
run = "pnpm --filter @workspace/marine-debris-sonar run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/marine-debris-sonar", "run", "build" ]
serve = "static"
publicDir = "artifacts/marine-debris-sonar/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21846"
BASE_PATH = "/"
